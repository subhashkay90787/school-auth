# ===================================================================
# SPRING APPLICATION & SERVER CONFIGURATION
# ===================================================================
spring.application.name=${SPRING_APPLICATION_NAME:auth-server}
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/}

# ===================================================================
# DATABASE CONFIGURATION (PostgreSQL)
# ===================================================================
#spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/school_platform_db}
#spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT:20000}

# ===================================================================
# JPA & HIBERNATE CONFIGURATION
# ===================================================================
# Explicitly search for entities and tables within the 'identity' schema
spring.jpa.properties.hibernate.default_schema=identity
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# Initialization behavior (Set to true if using schema.sql / data.sql execution)
spring.jpa.defer-datasource-initialization=${SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION:true}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:schema.sql

# ===================================================================
# OAUTH2 AUTHORIZATION SERVER SETTINGS
# ===================================================================
# Public issuer URL generated in JWTs and OIDC metadata
spring.security.oauth2.authorizationserver.issuer=${OAUTH2_ISSUER_URL:https://auth.yourplatform.com}

# Token Lifetimes
oauth2.token.access-token-time-to-live-minutes=${ACCESS_TOKEN_TTL_MINUTES:30}
oauth2.token.refresh-token-time-to-live-days=${REFRESH_TOKEN_TTL_DAYS:90}

# Registered Mobile Client Specs
oauth2.client.mobile.client-id=${MOBILE_CLIENT_ID:school-mobile-app}

# ===================================================================
# OAUTH2 CLIENT / SOCIAL LOGINS (Google, Facebook, Microsoft)
# ===================================================================
# Google Client Credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Facebook Client Credentials
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:facebook-client-id-placeholder}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:facebook-client-secret-placeholder}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email

# Microsoft Azure AD Credentials
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:microsoft-client-id-placeholder}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:microsoft-client-secret-placeholder}
spring.security.oauth2.client.registration.microsoft.client-name=Microsoft
spring.security.oauth2.client.registration.microsoft.provider=microsoft
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email,User.Read
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Microsoft Azure AD Provider Endpoints
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}
logging.level.org.springframework.security.oauth2=${LOGGING_LEVEL_OAUTH2:INFO}